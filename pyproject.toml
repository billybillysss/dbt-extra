[project]
name = "dbt-extra"
dynamic = ["version"]
description = "Offline dbt transformation review, inspection, editing, and optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "PyYAML>=6.0.3",
    "ruamel.yaml>=0.18,<0.20",
    "openpyxl>=3.1.5",
    "sqlglot>=30.29.0",
]

[project.scripts]
extra = "dbt_extra.cli:cli"

[project.urls]
Repository = "https://github.com/billybillysss/dbt-extra"
Documentation = "https://github.com/billybillysss/dbt-extra/blob/HEAD/docs/index.md"
Issues = "https://github.com/billybillysss/dbt-extra/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_extra"]

[tool.hatch.version]
path = "src/dbt_extra/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/examples", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/CHANGELOG.md"]

[dependency-groups]
dev = ["dbt-duckdb>=1.10.0", "pytest>=9.1.1", "pytest-xdist>=3.8.0"]

[tool.pytest.ini_options]
addopts = "-n 4"
testpaths = ["tests"]
