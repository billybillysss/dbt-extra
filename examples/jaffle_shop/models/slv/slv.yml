version: 2
models:
- name: slv_customers
  description: Standardized customer identifiers and names; owns a check-strategy
    snapshot.
  config:
    meta:
      domain: sales
  columns:
  - name: customer_id
    data_type: bigint
    description: Application customer identifier.
    data_tests:
    - unique
    - not_null
  - name: first_name
    data_type: varchar
    description: Customer first name, with surrounding whitespace removed.
  - name: last_name
    data_type: varchar
    description: Customer last-name initial, with surrounding whitespace removed.
- name: slv_orders
  description: Standardized order keys, date and lifecycle status.
  config:
    meta:
      domain: sales
  columns:
  - name: order_id
    data_type: bigint
    description: Application order identifier.
    data_tests:
    - unique
    - not_null
  - name: customer_id
    data_type: bigint
    description: Customer who placed the order.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''slv_customers'') }}'
          field: customer_id
  - name: order_date
    data_type: date
    description: Date the order was placed.
  - name: status
    data_type: varchar
    data_tests:
    - accepted_values:
        arguments:
          values:
          - placed
          - shipped
          - completed
          - return_pending
          - returned
- name: slv_payments
  description: Payments in currency units; shorthand columns deliberately demonstrate
    enrich.
  config:
    meta:
      domain: sales
  columns:
  - name: payment_id
    data_type: bigint
    data_tests:
    - unique
    - not_null
  - name: order_id
  - name: payment_method
  - name: amount
    data_type: decimal(12, 2)
    description: Payment amount converted from cents to currency units.
    data_tests:
    - not_null
    - nonnegative
