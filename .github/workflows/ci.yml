name: Validate and build

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            integration: false
          - os: ubuntu-latest
            python: "3.13"
            integration: true
          - os: windows-latest
            python: "3.13"
            integration: false
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest
      - if: matrix.integration
        name: Execute original and rewritten dbt projects
        env:
          DBT_EXTRA_DBT_TESTS: "1"
        run: uv run pytest -n 0 tests/workflows/test_optimizer_dbt_execution.py
      - run: uv run extra --project-dir examples/jaffle_shop validate
      - if: matrix.integration
        name: Build and review native dbt example
        run: |
          uv run extra --project-dir examples/jaffle_shop export --preview
          uv run extra --project-dir examples/jaffle_shop optimize --preview
          uv run dbt build --project-dir examples/jaffle_shop --profiles-dir examples/jaffle_shop
          uv run dbt docs generate --project-dir examples/jaffle_shop --profiles-dir examples/jaffle_shop
          uv run extra --project-dir examples/jaffle_shop validate
          uv run extra --project-dir examples/jaffle_shop export --format json --preview

  sql-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlglot:
          - "sqlglot==30.29.0"
          - "sqlglot"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13
      - run: uv pip install --upgrade "${{ matrix.sqlglot }}"
      - name: Minimum and fresh dependency compatibility (do not resync lock)
        run: uv run --no-sync pytest tests/sql/test_source_optimization.py tests/sql/test_optimizer_semantics.py tests/sql/test_generated_optimization.py tests/sql/test_jinja_execution.py tests/sql/functions/test_effect_safety.py tests/sql/test_partial_optimization.py tests/sql/test_static_jinja.py tests/workflows/test_inspection_rules.py tests/workflows/test_synthetic_optimization.py

  spark-semantics:
    runs-on: ubuntu-latest
    env:
      DBT_EXTRA_SPARK_TESTS: "1"
      SPARK_LOCAL_IP: "127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13
      - run: uv pip install "pyspark==4.2.1"
      - name: Execute synthetic Spark SQL with ANSI on and off
        run: env -u SPARK_HOME uv run --no-sync pytest -n 0 tests/sql/test_spark_optimization.py

  postgres-semantics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optimizer
          POSTGRES_PASSWORD: optimizer
          POSTGRES_DB: optimizer_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optimizer -d optimizer_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DBT_EXTRA_POSTGRES_DSN: postgresql://optimizer:optimizer@localhost:5432/optimizer_tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13
      - run: uv pip install "psycopg[binary]>=3.2,<4"
      - name: Execute source rules and inspection boundaries on PostgreSQL
        run: uv run --no-sync pytest -n 0 tests/sql/test_postgres_optimization.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv build --python 3.11
      - name: Smoke test installed wheel
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/dbt-extra-package-smoke"
          uv pip install --python "$RUNNER_TEMP/dbt-extra-package-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/dbt-extra-package-smoke/bin/python" scripts/smoke_distribution.py
      - name: Test installed wheel with fresh dependencies
        run: |
          uv pip install --python "$RUNNER_TEMP/dbt-extra-package-smoke/bin/python" "pytest>=9.1.1" "pytest-xdist>=3.8.0" duckdb
          "$RUNNER_TEMP/dbt-extra-package-smoke/bin/python" -m pytest --tb=short
      - name: Smoke test installed source archive
        run: |
          uv pip install --python "$RUNNER_TEMP/dbt-extra-package-smoke/bin/python" --reinstall-package dbt-extra dist/*.tar.gz
          "$RUNNER_TEMP/dbt-extra-package-smoke/bin/python" scripts/smoke_distribution.py
